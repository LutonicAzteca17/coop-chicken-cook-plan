<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coop Chicken Cook Plan</title>
<style>
  :root { --bg:#111; --fg:#fff; --mute:#c4c4c4; --hi:#ffcc00; --card:#1e1e1e; --line:#333; --good:#5ad17a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: -apple-system, system-ui, Arial, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { font-size: 22px; padding: 14px 20px; border-radius: 10px; border: 2px solid var(--line);
           background: var(--card); color: var(--fg); cursor: pointer; flex:1; }
  button.on { background: var(--hi); color:#000; border-color: var(--hi); font-weight:700; }
  select { font-size:18px; padding:10px; background:var(--card); color:var(--fg); border:2px solid var(--line); border-radius:10px; }
  .now { margin: 16px 0; padding: 24px; border-radius: 16px; background: var(--hi); color:#000; text-align:center; }
  .now .lbl { font-size: 26px; font-weight: 700; }
  .now .big { font-size: 96px; font-weight: 900; line-height: 1; margin: 8px 0; }
  .now .sub { font-size: 22px; }
  .next { text-align:center; font-size: 24px; color: var(--mute); margin-bottom: 16px; }
  table { width:100%; border-collapse: collapse; font-size: 26px; }
  td, th { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align:left; }
  td.n { text-align:right; font-weight:800; }
  tr.cur td { background: var(--hi); color:#000; }
  tr.past td { color: var(--mute); }
  .was { color: var(--mute); font-size: 18px; }
  h2 { font-size: 20px; color: var(--mute); font-weight:600; margin: 28px 0 8px; }
  .week { font-size: 16px; overflow-x:auto; }
  .week table { font-size: 16px; }
  .week td, .week th { padding: 6px 8px; text-align:right; }
  .week th:first-child, .week td:first-child { text-align:left; }
  .small { font-size: 15px; color: var(--mute); line-height:1.5; }
  .stat { color: var(--good); font-weight:700; }
  @media (max-width: 500px) { .now .big { font-size: 72px; } table { font-size: 22px; } }
  .wk { margin-top: 32px; }
  .wk h2 { font-size: 24px; color: var(--fg); margin: 0 0 4px; }
  .wk .legend { font-size: 16px; color: var(--mute); margin-bottom: 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .wk .sw { display:inline-block; width:18px; height:18px; border-radius:4px; vertical-align:middle; }
  .wk table { font-size: 17px; table-layout: fixed; }
  .wk th, .wk td { padding: 8px 2px; text-align: center; border-bottom: 1px solid var(--bg); }
  .wk th:first-child, .wk td:first-child { text-align: left; padding-left: 4px; width: 78px; color: var(--mute); font-size: 15px; }
  .wk td.c { font-weight: 800; border-radius: 4px; }
  .wk th.today { color: var(--hi); }
  .wk td.today { outline: 2px solid var(--hi); outline-offset: -2px; }
  .wk tr.tot td { color: var(--fg); font-weight: 700; border-top: 2px solid var(--line); }
  .clock { font-size: 20px; color: var(--fg); }
  .back { flex: 0 0 auto; font-size: 18px; padding: 10px 14px; background: var(--hi); color: #000; border-color: var(--hi); font-weight: 700; }
  .ahead { background: #2a2a2a; color: var(--fg); border: 2px dashed var(--hi); }
  button:focus-visible, select:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .wk .legend { font-size: 18px; color: var(--fg); }
  .wk table { font-size: 19px; }
  .rule { margin: 0 0 18px; padding: 12px 16px; border: 2px solid var(--hi); border-radius: 12px; font-size: 21px; text-align: center; color: var(--fg); }
  .rule b { color: var(--hi); }
  @media print { body { background:#fff; color:#000; } .now, button, select { display:none; } }
</style>
</head>
<body>
<main>
  <div class="row" id="locs"></div>
  <div class="row" style="margin-top:8px; align-items:center; gap:12px;">
    <label for="day" class="small">Day:</label>
    <select id="day" aria-label="Pick a day"></select>
    <span class="clock" id="clock"></span>
    <button id="back" class="back" onclick="backToToday()">Back to today</button>
  </div>

  <div class="now" id="now" role="status" aria-live="polite"></div>
  <div class="next" id="next"></div>
  <div class="rule" id="rule"></div>

  <table id="today" aria-label="Drops for the day"></table>

  <div class="wk">
    <h2 id="wktitle"></h2>
    <div class="legend">Times are when to drop. Brighter yellow = busier. Today has a box around it.</div>
    <table id="week" aria-label="Pieces to drop each hour, every day this week"></table>
  </div>

</main>

<script>
const D = /*DATA*/null;
// Which day it is right now (recomputed every render, so it rolls over at midnight)
let dayName = todayName();
// The store can be fixed per screen with ?store=Fishtown in the link; otherwise the last one tapped is remembered.
const urlStore = new URLSearchParams(location.search).get("store");
let loc = matchStore(urlStore) || matchStore(localGet("loc")) || D.locations[0];
let day = dayName;
let followToday = true;   // the screen follows the clock unless someone picks another day
const loadedOn = new Date().toDateString();

function todayName(){ return D.days[(new Date().getDay() + 6) % 7]; }
function matchStore(s){
  if (!s) return null;
  const k = s.toLowerCase().replace(/[^a-z]/g, "");
  return D.locations.find(l => l.toLowerCase().replace(/[^a-z]/g, "") === k) || null;
}

function localGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function localSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

// Each batch takes D.fry_minutes, so the drop for an hour happens that many minutes
// before the hour (e.g. the 12 PM batch goes in at 11:48). The screen runs that far ahead.
function nowHour() {
  const d = new Date(Date.now() + D.fry_minutes * 60000);
  return String(d.getHours()).padStart(2,"0") + ":00";
}
function clockLabel(mins) {
  let hh = Math.floor(mins / 60), mm = mins % 60; const ap = hh >= 12 ? "PM" : "AM"; hh = hh % 12 || 12;
  return hh + ":" + String(mm).padStart(2, "0") + " " + ap;
}
function pretty(h) { return clockLabel(parseInt(h) * 60 - D.fry_minutes); }   // time to drop
function readyAt(h) { let n = parseInt(h); const ap = n >= 12 ? "PM" : "AM"; n = n % 12 || 12; return n + " " + ap; }

function render() {
  const plan = D.plan[loc][day];
  const hours = D.hours;
  const live = day === dayName;
  const h = nowHour();

  document.getElementById("locs").innerHTML = D.locations.map(l =>
    `<button class="${l===loc?'on':''}" aria-pressed="${l===loc}" onclick="setLoc('${l}')">${l}</button>`).join("");
  document.getElementById("day").innerHTML = D.days.map(d =>
    `<option ${d===day?'selected':''}>${d}</option>`).join("");
  document.getElementById("clock").textContent = live ? "Now: " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : "";
  document.getElementById("back").style.display = live ? "none" : "";

  // NOW card
  const nowEl = document.getElementById("now"), nextEl = document.getElementById("next");
  let curIdx = hours.indexOf(h);
  if (live && curIdx >= 0) {
    nowEl.style.display = "";
    nowEl.innerHTML = `<div class="lbl">DROP NOW</div><div class="big">${plan[h]}</div><div class="sub">pieces, ready by ${readyAt(h)}</div>`;
    const nh = hours[curIdx + 1];
    nextEl.textContent = nh ? `Next: drop ${plan[nh]} at ${pretty(nh)}` : "Last drop of the day. No more after this.";
  } else if (live && h < hours[0]) {
    nowEl.style.display = "";
    nowEl.innerHTML = `<div class="lbl">FIRST DROP AT ${pretty(hours[0])}</div><div class="big">${plan[hours[0]]}</div><div class="sub">pieces, ready by ${readyAt(hours[0])}</div>`;
    nextEl.textContent = "";
  } else if (live) {
    nowEl.style.display = "";
    nowEl.innerHTML = `<div class="lbl">DONE FOR TODAY</div><div class="big">0</div><div class="sub">No more drops today. Write down what's left in the waste log.</div>`;
    nextEl.textContent = "";
  } else {
    nowEl.style.display = "";
    nowEl.className = "now ahead";
    nowEl.innerHTML = `<div class="lbl">Looking ahead at ${day}</div><div class="sub">This is not today. Tap "Back to today" to see what to drop now.</div>`;
    nextEl.textContent = "";
  }
  if (live) nowEl.className = "now";
  // Backup rule: always shown so the cook never has to remember it
  document.getElementById("rule").innerHTML =
    `Down to ${D.backup_at} pieces? <b>Drop ${D.backup_drop} more now.</b><br>Chicken older than ${D.hold_minutes} minutes: <b>toss it.</b>`;
  document.getElementById("rule").style.display = "";

  // Today table
  const total = hours.reduce((s,x)=>s+plan[x],0);
  document.getElementById("today").innerHTML =
    `<tr><th>Drop at · ${live ? "today" : day}</th><th style="text-align:right">Pieces</th></tr>` +
    hours.map(x => `<tr class="${live && x===h ? 'cur' : (live && x<h ? 'past':'')}"><td>${pretty(x)}</td><td class="n">${plan[x]}</td></tr>`).join("") +
    `<tr><td>Total for the day</td><td class="n">${total}</td></tr>`;

  // Week snapshot: one color per busyness level, today outlined
  const all = D.days.flatMap(d => hours.map(x => D.plan[loc][d][x]));
  const lo = Math.min(...all), hi = Math.max(...all);
  const shade = n => {
    const f = (n - lo) / ((hi - lo) || 1);
    const mix = (a, b) => Math.round(a + (b - a) * f);
    const r = mix(70,255), g = mix(60,204), b = mix(25,0);
    // pick black or white text, whichever reads better on this shade
    const lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
    return `background:rgb(${r},${g},${b});color:${lum > 0.45 ? '#000' : '#fff'}`;
  };
  document.getElementById("wktitle").textContent = "This week at " + loc;
  document.getElementById("week").innerHTML =
    "<tr><th></th>" + D.days.map(d => `<th class="${d===dayName?'today':''}">${d.slice(0,3)}</th>`).join("") + "</tr>" +
    hours.map(x => `<tr><td>${pretty(x)}</td>` + D.days.map(d =>
      `<td class="c ${d===dayName?'today':''}" style="${shade(D.plan[loc][d][x])}">${D.plan[loc][d][x]}</td>`).join("") + "</tr>").join("") +
    `<tr class="tot"><td>Total</td>` + D.days.map(d => `<td>${hours.reduce((s,x)=>s+D.plan[loc][d][x],0)}</td>`).join("") + "</tr>";
}
function backToToday(){ followToday = true; day = todayName(); render(); }
function setLoc(l){ loc = l; localSet("loc", l); render(); }
document.getElementById("day").onchange = e => {
  day = e.target.value; followToday = (day === todayName()); render();
};
function tick(){
  // New day: reload once so a screen left on all week picks up the latest weekly plan.
  if (new Date().toDateString() !== loadedOn && new Date().getHours() >= 4) { location.reload(); return; }
  dayName = todayName();
  if (followToday) day = dayName;
  render();
}
render();
setInterval(tick, 30000);

// Every 10 minutes, check whether a new weekly plan was published. If the plan on the
// site is different from the one on screen, reload so nobody has to touch the device.
const shownPlan = JSON.stringify([D.week_of, D.plan]);
async function checkForNewPlan(){
  try {
    const r = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const t = await r.text();
    const m = t.match(/const D = (\{.*?\});\s*\n/s);
    if (!m) return;
    const fresh = JSON.parse(m[1]);
    if (fresh && fresh.plan && JSON.stringify([fresh.week_of, fresh.plan]) !== shownPlan) location.reload();
  } catch (e) { /* offline or busy: keep showing the current plan and try again later */ }
}
setInterval(checkForNewPlan, 10 * 60 * 1000);
</script>
</body>
</html>
