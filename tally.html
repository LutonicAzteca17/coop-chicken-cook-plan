<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicken Tally Sheet</title>
<style>
  :root { --fg:#000; --bg:#fff; --line:#000; --mute:#444; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fg:#fff; --bg:#111; --line:#888; --mute:#bbb; } }
  :root[data-theme="dark"] { --fg:#fff; --bg:#111; --line:#888; --mute:#bbb; }
  body { margin:0; padding:16px; font-family: Arial, sans-serif; color:var(--fg); background:var(--bg); }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p { font-size: 18px; margin: 0 0 14px; color: var(--mute); }
  table { width:100%; border-collapse: collapse; table-layout: fixed; }
  th, td { border: 2px solid var(--line); height: 56px; font-size: 18px; text-align:center; }
  th:first-child, td:first-child { width: 80px; font-weight: 700; }
  .store { font-size: 20px; margin-bottom: 10px; }
  @media print { body { padding: 0; } button { display:none; } :root { --fg:#000; --bg:#fff; --line:#000; --mute:#333; } }
  button { font-size:18px; padding:10px 16px; margin-bottom:12px; }
</style>
</head>
<body>
  <button onclick="window.print()">Print this sheet</button>
  <h1>Asked for chicken, none ready</h1>
  <p>Each time a customer asks for chicken and there's none ready, make one tick mark in that hour and day. That's it.</p>
  <div class="store">Store: ____________________ &nbsp;&nbsp; Week of: ____________</div>
  <table>
    <tr><th></th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr>
    <tr><td>11 AM</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>12 PM</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>1 PM</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>2 PM</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>3 PM</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>4 PM</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>5 PM</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>6 PM</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>7 PM</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>8 PM</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>9 PM</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
  </table>
</body>
</html>
